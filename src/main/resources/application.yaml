spring:
  application:
    name: ahadith
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${PORT:8080}
  address: 0.0.0.0

app:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  mail:
    enabled: false
    from: ${APP_MAIL_FROM:}
    frontend-base-url: ${APP_MAIL_FRONTEND_BASE_URL:http://localhost:8080}
    verification-base-url:
    verification-path: /verify-email
    verification-token-ttl: 24h
    reset-token-ttl: 30m
    resend-throttle: 5m
  security:
    search-history-max-per-user: 50
    login-max-failures: 5
    login-lock-duration: 15m
    trusted-proxy-headers: false
