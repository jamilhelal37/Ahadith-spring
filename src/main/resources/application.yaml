spring:
  application:
    name: ahadith
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

app:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:}
    frontend-base-url: ${APP_MAIL_FRONTEND_BASE_URL:http://localhost:8080}
    verification-base-url: ${APP_MAIL_VERIFICATION_BASE_URL:${APP_MAIL_FRONTEND_BASE_URL:http://localhost:8080}}
    verification-path: ${APP_MAIL_VERIFICATION_PATH:/verify-email}
    verification-token-ttl: ${APP_MAIL_VERIFICATION_TOKEN_TTL:24h}
    reset-token-ttl: ${APP_MAIL_RESET_TOKEN_TTL:30m}
    resend-throttle: ${APP_MAIL_RESEND_THROTTLE:5m}
  security:
    search-history-max-per-user: ${SEARCH_HISTORY_MAX_PER_USER:50}
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-lock-duration: ${LOGIN_LOCK_DURATION:15m}
    trusted-proxy-headers: ${TRUSTED_PROXY_HEADERS:false}
