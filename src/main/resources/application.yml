spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: ahadith
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${PORT:8080}
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    provider: ${APP_MAIL_PROVIDER:resend}
    from: ${APP_MAIL_FROM:}
    frontend-base-url: ${APP_MAIL_FRONTEND_BASE_URL:http://localhost:8080}
    verification-base-url:
    verification-path: /verify-email
    resend-api-key: ${RESEND_API_KEY:}
    verification-token-ttl: 24h
    reset-token-ttl: 30m
    resend-throttle: 5m
  security:
    search-history-max-per-user: 50
    login-max-failures: 5
    login-lock-duration: 15m
    trusted-proxy-headers: false
