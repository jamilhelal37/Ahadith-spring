spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: ahadith
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:11MB}
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:12MB}
  jpa:
    open-in-view: false

server:
  port: ${PORT:8080}
  address: 0.0.0.0

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
    build-time: ${APP_BUILD_TIME:unknown}
    git-commit: ${APP_GIT_COMMIT:unknown}

springdoc:
  paths-to-match: /api/v1/**

app:
  api:
    legacy-sunset: ${APP_API_LEGACY_SUNSET:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Request-Id
    exposed-headers: X-Request-Id
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:false}
    max-age: ${APP_CORS_MAX_AGE:1h}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  upgrade:
    document:
      max-size: ${APP_UPGRADE_DOCUMENT_MAX_SIZE:10MB}
      max-pages: ${APP_UPGRADE_DOCUMENT_MAX_PAGES:20}
      download-ttl: ${APP_UPGRADE_DOCUMENT_DOWNLOAD_TTL:5m}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    provider: ${APP_MAIL_PROVIDER:resend}
    from: ${APP_MAIL_FROM:}
    frontend-base-url: ${APP_MAIL_FRONTEND_BASE_URL:http://localhost:8080}
    verification-base-url: ${APP_MAIL_VERIFICATION_BASE_URL:}
    verification-path: /verify-email
    resend-api-key: ${RESEND_API_KEY:}
    verification-token-ttl: 24h
    reset-token-ttl: 30m
    resend-throttle: 5m
    connect-timeout: ${APP_MAIL_CONNECT_TIMEOUT:5s}
    read-timeout: ${APP_MAIL_READ_TIMEOUT:10s}
  google-auth:
    enabled: ${APP_GOOGLE_AUTH_ENABLED:false}
    client-ids: ${GOOGLE_AUTH_CLIENT_IDS:}
  fcm:
    enabled: ${APP_FCM_ENABLED:false}
  security:
    search-history-max-per-user: 50
    login-max-failures: 5
    login-lock-duration: 15m
    trusted-proxy-headers: ${APP_SECURITY_TRUSTED_PROXY_HEADERS:false}
  rate-limit:
    # In-memory limits are scoped to one running instance. Use a shared Redis-backed implementation when scaling out.
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    cache-max-size: ${APP_RATE_LIMIT_CACHE_MAX_SIZE:10000}
    cache-expire-after-access: ${APP_RATE_LIMIT_CACHE_EXPIRE_AFTER_ACCESS:2h}
    policies:
      register:
        capacity: ${APP_RATE_LIMIT_REGISTER_CAPACITY:5}
        window: ${APP_RATE_LIMIT_REGISTER_WINDOW:15m}
      login:
        capacity: ${APP_RATE_LIMIT_LOGIN_CAPACITY:20}
        window: ${APP_RATE_LIMIT_LOGIN_WINDOW:1m}
      google-login:
        capacity: ${APP_RATE_LIMIT_GOOGLE_LOGIN_CAPACITY:20}
        window: ${APP_RATE_LIMIT_GOOGLE_LOGIN_WINDOW:1m}
      login-email:
        capacity: ${APP_RATE_LIMIT_LOGIN_EMAIL_CAPACITY:10}
        window: ${APP_RATE_LIMIT_LOGIN_EMAIL_WINDOW:1m}
      forgot-password-ip:
        capacity: ${APP_RATE_LIMIT_FORGOT_PASSWORD_IP_CAPACITY:3}
        window: ${APP_RATE_LIMIT_FORGOT_PASSWORD_IP_WINDOW:15m}
      forgot-password-email:
        capacity: ${APP_RATE_LIMIT_FORGOT_PASSWORD_EMAIL_CAPACITY:3}
        window: ${APP_RATE_LIMIT_FORGOT_PASSWORD_EMAIL_WINDOW:1h}
      resend-verification:
        capacity: ${APP_RATE_LIMIT_RESEND_VERIFICATION_CAPACITY:3}
        window: ${APP_RATE_LIMIT_RESEND_VERIFICATION_WINDOW:15m}
      verify-email:
        capacity: ${APP_RATE_LIMIT_VERIFY_EMAIL_CAPACITY:10}
        window: ${APP_RATE_LIMIT_VERIFY_EMAIL_WINDOW:15m}
      reset-password:
        capacity: ${APP_RATE_LIMIT_RESET_PASSWORD_CAPACITY:10}
        window: ${APP_RATE_LIMIT_RESET_PASSWORD_WINDOW:15m}
      refresh:
        capacity: ${APP_RATE_LIMIT_REFRESH_CAPACITY:30}
        window: ${APP_RATE_LIMIT_REFRESH_WINDOW:1m}
      public-hadith-search:
        capacity: ${APP_RATE_LIMIT_PUBLIC_HADITH_SEARCH_CAPACITY:60}
        window: ${APP_RATE_LIMIT_PUBLIC_HADITH_SEARCH_WINDOW:1m}
      upgrade-request-create:
        capacity: ${APP_RATE_LIMIT_UPGRADE_REQUEST_CREATE_CAPACITY:5}
        window: ${APP_RATE_LIMIT_UPGRADE_REQUEST_CREATE_WINDOW:1d}
  public-cache:
    reference-max-size: ${APP_PUBLIC_CACHE_REFERENCE_MAX_SIZE:128}
    reference-expire-after-write: ${APP_PUBLIC_CACHE_REFERENCE_EXPIRE_AFTER_WRITE:30m}
  cleanup:
    enabled: ${APP_CLEANUP_ENABLED:true}
    initial-delay: ${APP_CLEANUP_INITIAL_DELAY:10m}
    fixed-delay: ${APP_CLEANUP_FIXED_DELAY:6h}
    token-retention: ${APP_CLEANUP_TOKEN_RETENTION:7d}
    login-attempt-retention: ${APP_CLEANUP_LOGIN_ATTEMPT_RETENTION:30d}
    batch-size: ${APP_CLEANUP_BATCH_SIZE:1000}
