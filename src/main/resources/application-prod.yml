spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_ACCESS_EXPIRATION:1h}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
server:
  port: ${PORT:8080}
  address: 0.0.0.0
app:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    provider: ${APP_MAIL_PROVIDER:resend}
    from: ${APP_MAIL_FROM}
    frontend-base-url: ${APP_MAIL_FRONTEND_BASE_URL}
    verification-base-url:
    verification-path: /verify-email
    resend-api-key: ${RESEND_API_KEY:}
    verification-token-ttl: 24h
    reset-token-ttl: 30m
    resend-throttle: 5m
  security:
    search-history-max-per-user: 50
    login-max-failures: 5
    login-lock-duration: 15m
    trusted-proxy-headers: false
