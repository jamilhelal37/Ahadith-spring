spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: test-secret-key-test-secret-key-test-secret-key-test-secret-key-test-secret-key
  expiration: 3600
  refresh-expiration: 604800

app:
  mail:
    enabled: false
    frontend-base-url: http://localhost:8080
    verification-base-url:
    verification-path: /verify-email
  cloudinary:
    cloud-name:
    api-key:
    api-secret:
  security:
    search-history-max-per-user: 50
    login-max-failures: 3
    login-lock-duration: 15m
    trusted-proxy-headers: false
