spring:
  datasource:
    url: jdbc:h2:mem:ahadith;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

jwt:
  secret: test-secret-key-test-secret-key-test-secret-key-test-secret-key-test-secret-key
  expiration: 1h
  refresh-expiration: 7d

app:
  mail:
    enabled: false
    provider: resend
    frontend-base-url: http://localhost:8080
    verification-base-url: http://localhost:8080
    verification-path: /verify-email
    resend-api-key:
  security:
    search-history-max-per-user: 50
    login-max-failures: 3
    login-lock-duration: 15m
