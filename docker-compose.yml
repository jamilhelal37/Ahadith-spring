services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ahadith-postgres
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-ahadith}
      POSTGRES_USER: ${LOCAL_POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: ahadith-embedding-service
    environment:
      EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_BATCH_SIZE: ${APP_EMBEDDING_BATCH_SIZE:-16}
      HF_HOME: /models/huggingface
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - huggingface-cache:/models/huggingface
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ahadith-app
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${LOCAL_POSTGRES_DB:-ahadith}
      SPRING_DATASOURCE_USERNAME: ${LOCAL_POSTGRES_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      PORT: ${PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-1h}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-true}
      APP_MAIL_PROVIDER: ${APP_MAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      APP_MAIL_FROM: ${APP_MAIL_FROM:?APP_MAIL_FROM is required}
      APP_MAIL_FRONTEND_BASE_URL: ${APP_MAIL_FRONTEND_BASE_URL:?APP_MAIL_FRONTEND_BASE_URL is required}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is required}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is required}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is required}
      APP_SEMANTIC_SEARCH_ENABLED: ${APP_SEMANTIC_SEARCH_ENABLED:-true}
      APP_EMBEDDING_SERVICE_URL: http://embedding-service:8001
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-BAAI/bge-m3}
      APP_EMBEDDING_MODEL_VERSION: ${APP_EMBEDDING_MODEL_VERSION:-1.3.5}
      APP_EMBEDDING_BATCH_SIZE: ${APP_EMBEDDING_BATCH_SIZE:-16}
      APP_SEMANTIC_MIN_SIMILARITY: ${APP_SEMANTIC_MIN_SIMILARITY:-0.45}
      APP_SEMANTIC_CANDIDATE_LIMIT: ${APP_SEMANTIC_CANDIDATE_LIMIT:-100}
      APP_HYBRID_RRF_K: ${APP_HYBRID_RRF_K:-60}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:$${PORT:-8080}/actuator/health/readiness\" | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  postgres-data:
  huggingface-cache:
